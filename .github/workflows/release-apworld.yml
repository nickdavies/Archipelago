name: Release APWorld

on:
  push:
    tags:
      - "v*"
      - "experimental"

permissions:
  contents: write

jobs:
  # Gate: a stale feasibility table must never ship in a release.
  feasibility:
    uses: ./.github/workflows/ksp1-feasibility.yml

  build:
    needs: feasibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Stamp world_version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -c "import json, pathlib; p = pathlib.Path('worlds/ksp1/archipelago.json'); m = json.loads(p.read_text()); m['world_version'] = '$version'; p.write_text(json.dumps(m, indent=4) + '\n')"
          cat worlds/ksp1/archipelago.json

      - name: Build ksp1.apworld
        working-directory: worlds
        run: |
          zip -r "$GITHUB_WORKSPACE/ksp1.apworld" ksp1/ \
            -x 'ksp1/__pycache__/*' \
            -x 'ksp1/test/*' \
            -x 'ksp1/scripts/*' \
            -x 'ksp1/reference/*' \
            -x 'ksp1/.apignore' \
            -x 'ksp1/.gitignore' \
            -x 'ksp1/.git/*' \
            -x 'ksp1/ksp_archipelago_design.md'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ksp1.apworld
          generate_release_notes: true
          prerelease: ${{ github.ref == 'refs/tags/experimental' }}
          make_latest: ${{ github.ref == 'refs/tags/experimental' && 'false' || 'true' }}
          name: ${{ github.ref == 'refs/tags/experimental' && 'Experimental Release latest features with the most bugs' || '' }}
